name: Uppfæra veðurgögn og birta síðu

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # á þriggja tíma fresti (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sækja gögn
        id: fetch
        continue-on-error: true   # ef Open-Meteo svarar ekki birtum við síðuna með eldri gögnum
        run: node scripts/fetch.mjs
      - name: Vista data.json
        if: steps.fetch.outcome == 'success'
        run: |
          git add public/data.json
          if git diff --cached --quiet; then
            echo "Engar breytingar"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Uppfæra veðurgögn"
            git pull --rebase
            git push
          fi
      - name: Byggja síðu
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
